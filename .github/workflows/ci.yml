# Checks every push to main and every pull request (AFD-132): the type checks, Biome and the unit
# and component tests, as `just check` and `just test` run them. The integration, engine and lab
# suites need VS Code, Docker images or the lab and stay local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Type check
        run: |
          npx --no-install tsc -p tsconfig.json
          npx --no-install tsc -p tsconfig.webview.json
          npx --no-install tsc -p test/unit/feedback

      - name: Lint and format
        run: npx --no-install biome ci .

      - name: Unit and component tests
        run: npx --no-install vitest run

      # ADR-0036: the npm packages other hosts use build, pack and load outside this repository's
      # bundles (as `just packages`).
      - name: Packages
        run: node scripts/packages.mjs --check
