# Publishes the VSIX to the Visual Studio Marketplace and Open VSX, and attaches it to a GitHub
# release whose notes are the version's CHANGELOG section.
#
# - A tag v<version> (matching package.json) publishes that version.
# - A manual run builds the VSIX from the chosen branch and uploads it as an artifact. With
#   dry_run unticked it also publishes package.json's version and creates its tag.
#
# Marketplace: Trusted Publishing (OIDC). The publisher's policy names this repository, this file
# and the environment "release", so they must not change without changing the policy.
# Open VSX: the OVSX_PAT secret; without it the step is skipped.
#
# npm (ADR-0036): the job "npm" publishes the packages other hosts use (@ansible-flow/core, assets,
# node, designer) with the extension's version, by Trusted Publishing (OIDC) only: no token is
# stored and none is read. Each package's trusted publisher names this repository, this file and
# the environment "release". npm sets a trusted publisher on a package that exists, so a package's
# first version is published by hand (`just packages-publish`, docs/packages.md). The job runs
# only when the repository variable NPM_PUBLISH is "true". A version that is already on npm is
# skipped, so the job can be run again.
#
# AFD-132: two jobs. "build" installs the dependencies, checks, tests and packages with no secret
# and no OIDC token, so an install script of a dependency can publish nothing. "publish" gets the
# token and the secrets, installs with --ignore-scripts and publishes the VSIX that "build" made.
# "npm" installs nothing: it publishes the tarballs that "build" made.
name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the VSIX only; publish nothing
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The same gates as CI (ci.yml): nothing is published that does not pass them.
      - name: Check and test
        run: |
          npx --no-install tsc -p tsconfig.json
          npx --no-install tsc -p tsconfig.webview.json
          npx --no-install biome ci .
          npx --no-install vitest run
          node scripts/packages.mjs --check --pack

      # The same as `just package`: the README rewrite, then vsce (which runs the production build).
      - name: Package
        env:
          VSIX: out/ansible-flow-designer-${{ steps.version.outputs.version }}.vsix
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/vsix-readme.ts
          npx --no-install vsce package --no-dependencies --no-rewrite-relative-links --readme-path out/vsix/README.md --out out/
          ls -l "$VSIX"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: out/ansible-flow-designer-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: out/npm
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release and its tag
      id-token: write # Marketplace Trusted Publishing
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
      VSIX: out/ansible-flow-designer-${{ needs.build.outputs.version }}.vsix
      # Whether the secret is set, without putting the secret in every step's environment.
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # vsce from the lockfile; no install script runs while the OIDC token is available.
      - run: npm ci --no-fund --no-audit --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: out

      - name: Visual Studio Marketplace
        run: npx --no-install vsce publish --oidc --packagePath "$VSIX" --skip-duplicate

      # Switching to Open VSX Trusted Publishing: remove the secret and this step's token condition.
      - name: Open VSX
        if: env.HAS_OVSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish --packagePath "$VSIX" --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          awk -v v="$VERSION" '/^## /{if(f)exit; if($2==v)f=1; next} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # An existing release keeps its VSIX: a rebuild differs in bytes (zip timestamps), and
          # a release's notes may quote the attached file's SHA-256.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$VSIX" --target "$GITHUB_SHA" \
              --title "Ansible Flow Designer $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "${VSIX##*/}"; then
            echo "::notice::Release $TAG already has ${VSIX##*/}; left as is"
          else
            gh release upload "$TAG" "$VSIX"
          fi

  # A failure here does not withdraw the VSIX: the two publish jobs do not depend on each other.
  npm:
    needs: build
    if: (github.event_name == 'push' || !inputs.dry_run) && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: out/npm

      # order.txt lists "<name>@<version> <tarball>", a package after the ones it depends on.
      # Provenance is attached by npm itself when it publishes by Trusted Publishing.
      - name: npm
        run: |
          # Trusted Publishing needs npm 11.5.1 or later; an older npm would ask for a token.
          NPM=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$NPM" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $NPM cannot publish by Trusted Publishing (11.5.1 or later)"
            exit 1
          fi
          while read -r spec tarball; do
            if npm view "$spec" version </dev/null >/dev/null 2>&1; then
              echo "::notice::$spec is already on npm; left as is"
              continue
            fi
            npm publish "out/npm/$tarball" --access public </dev/null
          done < out/npm/order.txt
