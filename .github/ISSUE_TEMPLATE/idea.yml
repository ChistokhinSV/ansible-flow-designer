# AFD-205: GitHub's form for a feature idea.
name: Idea
description: Something Ansible Flow Designer could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today (optional)
