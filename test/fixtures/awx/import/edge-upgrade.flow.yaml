schema_version: 2
flow:
  id: 01JDAWX0000000000000000038
  key: edge-upgrade
  name: AFD fixture · edge upgrade
  version: 1
  goal: Upgrade the edge switches in one maintenance window
  imported_from:
    kind: awx_workflow
    template: AFD fixture · edge upgrade
  inputs:
    devices:
      type: host_list
      required: true
      targets: true
      default:
      - edge
    change_ticket:
      type: string
      required: true
      default: CHG0001234
    reboot_wait:
      type: integer
      default: 300
    image:
      type: string
      required: true
      default: 17.9.4
    lab_enable_password:
      type: string
    site:
      type: string
      default: edge-lab
nodes:
- id: 01JDAWX0000000000000000001
  key: start
  type: start
  title: Start
- id: 01JDAWX0000000000000000002
  key: precheck
  type: task
  title: AFD fixture · precheck
  intent: Check reachability and free flash before the upgrade
  status: implemented
  impl:
    kind: playbook
    ref: flows/awx-e2e/generated/awx-e2e.yml
    params:
      min_flash_mb: 512
  settings:
    credential: Demo Credential
    execution_environment: AFD EE (ansible-core 2.19)
    inventory_target: edge
    tags:
    - precheck
- id: 01JDAWX0000000000000000003
  key: approve
  type: approval
  title: Approve the upgrade window
  status: implemented
  intent: Network on-call approves
  ports:
  - timeout
  settings:
    timeout: 30m
- id: 01JDAWX0000000000000000004
  key: upgrade
