# Fictional hosts for engine tests. Nothing outside the container is contacted: reachable hosts
# use the local connection; h07 points ssh at a closed port, so it is unreachable.
[edge]
sw-edge-0[1:4]

[lab]
h0[1:6]
h07 ansible_connection=ssh ansible_host=127.0.0.1 ansible_port=1

# Override targets (AFD-14): load balancers, and the groups the os-upgrade example drains.
[lb]
lb-0[1:2]

[edge_switches:children]
edge

[core_spines]
core-sp-0[1:2]

[all:vars]
ansible_connection=local
ansible_python_interpreter={{ ansible_playbook_python }}
