# Fictional edge switches (RFC 5737 management addresses are not contacted: local connection).
# sw-edge-05 points ssh at a closed port, so it is unreachable.
[edge]
sw-edge-0[1:4] ansible_connection=local
sw-edge-05 ansible_connection=ssh ansible_host=127.0.0.1 ansible_port=1

[local]
localhost ansible_connection=local
