- name: Edge baseline
  hosts: edge
  gather_facts: false
  vars_files:
    - ../vars/baseline.yml
  vars_prompt:
    - name: enable_secret
      prompt: Enable secret of the switches
      private: true
  vars:
    out_dir: /tmp/afd-import
    # Fictional test value; the test vault password is in .vault-pass.
    snmp_community: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          33373337636331666330666361666264306134623731393036313938323133303038613863313736
          3837643663343362663038616431373530313737306632660a623530306265656331393165386261
          64393765356638356230346536323532623964623963663262653664313161366231316165353433
          3562613230336563300a623933336463386562643932373635396235373431396535343963663062
          38613235306366303130316563356330363461306464313265376636626434623138

  roles:
    - role: netops_backup

  tasks:
    - name: Push the baseline
      block:
        - name: Render the MOTD
          template:
            src: motd.j2
            dest: "{{ out_dir }}/{{ inventory_hostname }}/motd.txt"
            mode: "0644"
          notify: Save config

        - name: Configure the uplinks
          copy:
            content: "interface {{ item }}\n description uplink to the core\n"
            dest: "{{ out_dir }}/{{ inventory_hostname }}/{{ item }}.cfg"
            mode: "0644"
          loop: "{{ uplinks }}"
          notify: config changed

        - name: Set the SNMP community
          copy:
            content: "snmp community set ({{ snmp_community | length }} characters)\n"
            dest: "{{ out_dir }}/{{ inventory_hostname }}/snmp.txt"
            mode: "0644"
          no_log: true

        - name: Refuse the change on the canary switch
          fail:
            msg: the canary switch refused the baseline
          when: inventory_hostname == 'sw-edge-04'
      rescue:
        - name: Record the rollback
          copy:
            content: "rolled back\n"
            dest: "{{ out_dir }}/{{ inventory_hostname }}/rollback.txt"
            mode: "0644"
      always:
        - name: Record the attempt
          copy: content="attempted\n" dest="{{ out_dir }}/{{ inventory_hostname }}/attempt.txt" mode=0644

    - name: Check the enable secret was given
      assert:
        that:
          - enable_secret | length > 0
        quiet: true

    - name: Verify NTP
      include_tasks: tasks/verify.yml

    - name: Apply the NTP and AAA baseline
      include_role:
        name: push_baseline

  handlers:
    - name: Save config
      copy:
        content: "saved\n"
        dest: "{{ out_dir }}/{{ inventory_hostname }}/saved.txt"
        mode: "0644"
      listen: config changed

- name: Report
  hosts: local
  gather_facts: true
  tasks:
    - name: Write the summary
      copy:
        content: "baseline done on {{ ansible_facts['hostname'] | default('localhost') }}\n"
        dest: "{{ out_dir | default('/tmp/afd-import') }}/summary.txt"
        mode: "0644"
