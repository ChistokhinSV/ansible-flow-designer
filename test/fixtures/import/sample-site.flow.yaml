schema_version: 2
flow:
  id: 01JDSMP0000000000000000055
  key: site
  name: site
  version: 1
  imported_from:
    kind: playbook
    path: site.yml
  inputs:
    devices:
      type: host_list
      required: true
      targets: true
      default:
      - edge
    out_dir:
      type: string
      default: /tmp/edge-baseline
    enable_secret:
      type: string
      required: true
nodes:
- id: 01JDSMP0000000000000000001
  key: start
  type: start
  title: Start
- id: 01JDSMP0000000000000000002
  key: pre-checks
  type: subflow
  title: Pre-checks
  subflow:
    nodes:
    - id: 01JDSMP0000000000000000003
      key: create-the-report-folder
      type: task
      title: Create the report folder
      status: implemented
      impl:
        kind: module
        ref: ansible.builtin.file
        params:
          path: '{{ out_dir }}/{{ inventory_hostname }}'
          state: directory
          mode: '0755'
        keywords:
          check_mode: false
      origin:
        task: prechecks.yml#Create the report folder#1
        design: 714838a1
      inputs:
        out_dir:
          type: string
          from: flow.out_dir
    - id: 01JDSMP0000000000000000004
      key: read-the-software-version
      type: task
      title: Read the software version
      status: implemented
      impl:
        kind: module
        ref: ansible.builtin.command
        params:
          cmd: echo "17.9.4"
        register: version_check
        keywords:
          changed_when: false
          check_mode: false
      origin:
        task: prechecks.yml#Read the software version#1
        design: 34b346e3
      outputs:
        version_check:
          type: dict
          from: impl.register
    - id: 01JDSMP0000000000000000006
      key: check-the-version-is-supported
      type: task
      title: Check the version is supported
      status: implemented
      impl:
        kind: module
        ref: ansible.builtin.assert
        params:
          that:
          - version_check.stdout is version('17.0', '>=')
          fail_msg: Unsupported version {{ version_check.stdout }}
      origin:
        task: prechecks.yml#Check the version is supported#1
        design: 554dabbe
      inputs:
        version_check:
          type: dict
          from: read-the-software-version.version_check
    - id: 01JDSMP0000000000000000008
      key: record-the-pre-check
      type: task
      title: Record the pre-check
      status: implemented
      impl:
        kind: module
        ref: ansible.builtin.copy
        params:
          content: "version {{ version_check.stdout }}\n"
          dest: '{{ out_dir }}/{{ inventory_hostname }}/precheck.txt'
          mode: '0644'
        keywords:
          when: version_check.stdout is version('17.0', '>=')
      origin:
        task: prechecks.yml#Record the pre-check#1
        design: 11cac47b
      inputs:
        version_check:
          type: dict
          from: read-the-software-version.version_check
        out_dir:
          type: string
          from: flow.out_dir
    edges:
    - id: 01JDSMP0000000000000000005
      from:
        node: 01JDSMP0000000000000000003
        port: ok_hosts
      to:
        node: 01JDSMP0000000000000000004
        port: in
    - id: 01JDSMP0000000000000000007
      from:
        node: 01JDSMP0000000000000000004
        port: ok_hosts
      to:
        node: 01JDSMP0000000000000000006
        port: in
    - id: 01JDSMP0000000000000000009
      from:
        node: 01JDSMP0000000000000000006
        port: ok_hosts
      to:
        node: 01JDSMP0000000000000000008
        port: in
    boundary:
      in: 01JDSMP0000000000000000003
      outputs:
        ok_hosts:
        - node: 01JDSMP0000000000000000008
          port: ok_hosts
  status: implemented
- id: 01JDSMP0000000000000000011
  key: baseline
  type: subflow
  title: baseline
  subflow:
    nodes:
    - id: 01JDSMP0000000000000000012
      key: edge-baseline
      type: subflow
      title: Edge baseline
      subflow:
        nodes:
        - id: 01JDSMP0000000000000000013
          key: load-baseline-yml
          type: task
          title: Load baseline.yml
          intent: Load the variables of vars/baseline.yml
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.include_vars
            params:
              file: '{{ afd_repo_root }}/vars/baseline.yml'
          outputs:
            uplinks:
              type: any
            canary_switch:
              type: any
            ntp_servers:
              type: any
        - id: 01JDSMP0000000000000000014
          key: netops-backup
          type: task
          title: netops_backup
          intent: Runs role netops_backup
          status: implemented
          impl:
            kind: role
            ref: netops_backup
        - id: 01JDSMP0000000000000000016
          key: push-the-baseline
          type: subflow
          title: Push the baseline
          subflow:
            nodes:
            - id: 01JDSMP0000000000000000017
              key: render-the-motd
              type: task
              title: Render the MOTD
              status: implemented
              impl:
                kind: module
                ref: ansible.builtin.template
                params:
                  src: '{{ afd_repo_root }}/templates/motd.j2'
                  dest: '{{ out_dir }}/{{ inventory_hostname }}/motd.txt'
                  mode: '0644'
                register: render_the_motd_result
              origin:
                task: baseline.yml#Render the MOTD#1
                design: 04ce5d25
              inputs:
                out_dir:
                  type: string
                  from: flow.out_dir
              outputs:
                render_the_motd_result:
                  type: dict
                  from: impl.register
            - id: 01JDSMP0000000000000000018
              key: configure-the-uplinks
              type: task
              title: Configure the uplinks
              status: implemented
              impl:
                kind: module
                ref: ansible.builtin.copy
                params:
                  content: "interface {{ item }}\n description uplink to the core\n"
                  dest: '{{ out_dir }}/{{ inventory_hostname }}/{{ item }}.cfg'
                  mode: '0644'
                register: configure_the_uplinks_result
                keywords:
                  loop: '{{ uplinks }}'
              origin:
                task: baseline.yml#Configure the uplinks#1
                design: 40eaf454
              inputs:
                out_dir:
                  type: string
                  from: flow.out_dir
                uplinks:
                  type: any
                  from: load-baseline-yml.uplinks
              outputs:
                configure_the_uplinks_result:
                  type: dict
                  from: impl.register
            - id: 01JDSMP0000000000000000020
              key: refuse-the-change-on-the-canary-switch
              type: task
              title: Refuse the change on the canary switch
              status: implemented
              impl:
                kind: module
                ref: ansible.builtin.fail
                params:
                  msg: the canary switch refused the baseline
                keywords:
                  when: inventory_hostname == canary_switch
              origin:
                task: baseline.yml#Refuse the change on the canary switch#1
                design: 1a229065
              inputs:
                canary_switch:
                  type: any
                  from: load-baseline-yml.canary_switch
            edges:
            - id: 01JDSMP0000000000000000019
              from:
                node: 01JDSMP0000000000000000017
                port: ok_hosts
              to:
                node: 01JDSMP0000000000000000018
                port: in
            - id: 01JDSMP0000000000000000021
              from:
                node: 01JDSMP0000000000000000018
                port: ok_hosts
              to:
                node: 01JDSMP0000000000000000020
                port: in
            boundary:
              in: 01JDSMP0000000000000000017
              outputs:
                ok_hosts:
                - node: 01JDSMP0000000000000000020
                  port: ok_hosts
          status: implemented
          outputs:
            render_the_motd_result:
              type: any
              from: render-the-motd.render_the_motd_result
            configure_the_uplinks_result:
              type: any
              from: configure-the-uplinks.configure_the_uplinks_result
        - id: 01JDSMP0000000000000000023
          key: record-the-rollback
          type: task
          title: Record the rollback
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.copy
            params:
              content: "rolled back\n"
              dest: '{{ out_dir }}/{{ inventory_hostname }}/rollback.txt'
              mode: '0644'
          origin:
            task: baseline.yml#Record the rollback#1
            design: '238e8829'
          inputs:
            out_dir:
              type: string
              from: flow.out_dir
        - id: 01JDSMP0000000000000000025
          key: mark-the-failure-of-push-the-baseline
          type: task
          title: Mark the failure of Push the baseline
          intent: Hosts that failed in Push the baseline run the always steps, then fail
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.set_fact
            params:
              afd_failed_push_the_baseline: true
        - id: 01JDSMP0000000000000000027
          key: record-the-attempt
          type: task
          title: Record the attempt
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.copy
            params:
              content: "attempted\n"
              dest: '{{ out_dir }}/{{ inventory_hostname }}/attempt.txt'
              mode: '0644'
          origin:
            task: baseline.yml#Record the attempt#1
            design: a0abd3a0
          inputs:
            out_dir:
              type: string
              from: flow.out_dir
        - id: 01JDSMP0000000000000000031
          key: push-the-baseline-failed
          type: decision
          title: Failed in Push the baseline?
          intent: Hosts that failed before the always steps fail here, as in the source
          condition: afd_failed_push_the_baseline | default(false) | bool
          status: implemented
        - id: 01JDSMP0000000000000000033
          key: check-the-enable-secret-was-given
          type: task
          title: Check the enable secret was given
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.assert
            params:
              that:
              - enable_secret | length > 0
              quiet: true
          origin:
            task: baseline.yml#Check the enable secret was given#1
            design: 52dbdb6e
          inputs:
            enable_secret:
              type: string
              from: flow.enable_secret
        - id: 01JDSMP0000000000000000035
          key: verify-ntp
          type: subflow
          title: Verify NTP
          subflow:
            nodes:
            - id: 01JDSMP0000000000000000036
              key: read-the-ntp-status
              type: task
              title: Read the NTP status
              status: implemented
              impl:
                kind: module
                ref: ansible.builtin.command
                params:
                  cmd: echo "synchronised to {{ ntp_servers | first }}"
                register: ntp_status
                keywords:
                  changed_when: false
                  check_mode: false
              origin:
                task: tasks/verify.yml#Read the NTP status#1
                design: 46f6465c
              inputs:
                ntp_servers:
                  type: any
                  from: load-baseline-yml.ntp_servers
              outputs:
                ntp_status:
                  type: dict
                  from: impl.register
            - id: 01JDSMP0000000000000000037
              key: record-the-ntp-status
              type: task
              title: Record the NTP status
              status: implemented
              impl:
                kind: module
                ref: ansible.builtin.copy
                params:
                  content: "{{ ntp_status.stdout }}\n"
                  dest: '{{ out_dir }}/{{ inventory_hostname }}/ntp.txt'
                  mode: '0644'
              origin:
                task: tasks/verify.yml#Record the NTP status#1
                design: edf4f45a
              inputs:
                ntp_status:
                  type: dict
                  from: read-the-ntp-status.ntp_status
                out_dir:
                  type: string
                  from: flow.out_dir
            edges:
            - id: 01JDSMP0000000000000000038
              from:
                node: 01JDSMP0000000000000000036
                port: ok_hosts
              to:
                node: 01JDSMP0000000000000000037
                port: in
            boundary:
              in: 01JDSMP0000000000000000036
              outputs:
                ok_hosts:
                - node: 01JDSMP0000000000000000037
                  port: ok_hosts
          status: implemented
        - id: 01JDSMP0000000000000000040
          key: apply-the-ntp-and-aaa-baseline
          type: subflow
          title: Apply the NTP and AAA baseline
          impl:
            kind: role
            ref: push_baseline
          intent: Runs role push_baseline, one step per task file
          subflow:
            nodes:
            - id: 01JDSMP0000000000000000041
              key: ntp
              type: task
              title: NTP
              intent: 'push_baseline: tasks/ntp'
              status: implemented
              impl:
                kind: role
                ref: push_baseline
                params:
                  tasks_from: ntp
            - id: 01JDSMP0000000000000000042
              key: aaa
              type: task
              title: AAA
              intent: 'push_baseline: tasks/aaa'
              status: implemented
              impl:
                kind: role
                ref: push_baseline
                params:
                  tasks_from: aaa
            edges:
            - id: 01JDSMP0000000000000000043
              from:
                node: 01JDSMP0000000000000000041
                port: ok_hosts
              to:
                node: 01JDSMP0000000000000000042
                port: in
            boundary:
              in: 01JDSMP0000000000000000041
              outputs:
                ok_hosts:
                - node: 01JDSMP0000000000000000042
                  port: ok_hosts
          status: implemented
        - id: 01JDSMP0000000000000000045
          key: save-config
          type: task
          title: Save config
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.copy
            params:
              content: "saved\n"
              dest: '{{ out_dir }}/{{ inventory_hostname }}/saved.txt'
              mode: '0644'
            keywords:
              when: (render_the_motd_result | default({})) is changed or (configure_the_uplinks_result | default({})) is changed
          origin:
            task: baseline.yml#Save config#1
            design: f06cc5e4
          inputs:
            out_dir:
              type: string
              from: flow.out_dir
            render_the_motd_result:
              type: dict
              from: push-the-baseline.render_the_motd_result
            configure_the_uplinks_result:
              type: dict
              from: push-the-baseline.configure_the_uplinks_result
        edges:
        - id: 01JDSMP0000000000000000015
          from:
            node: 01JDSMP0000000000000000013
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000014
            port: in
        - id: 01JDSMP0000000000000000022
          from:
            node: 01JDSMP0000000000000000014
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000016
            port: in
        - id: 01JDSMP0000000000000000024
          from:
            node: 01JDSMP0000000000000000016
            port: failed_hosts
          to:
            node: 01JDSMP0000000000000000023
            port: in
        - id: 01JDSMP0000000000000000026
          from:
            node: 01JDSMP0000000000000000023
            port: failed_hosts
          to:
            node: 01JDSMP0000000000000000025
            port: in
        - id: 01JDSMP0000000000000000028
          from:
            node: 01JDSMP0000000000000000016
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000027
            port: in
        - id: 01JDSMP0000000000000000029
          from:
            node: 01JDSMP0000000000000000023
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000027
            port: in
        - id: 01JDSMP0000000000000000030
          from:
            node: 01JDSMP0000000000000000025
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000027
            port: in
        - id: 01JDSMP0000000000000000032
          from:
            node: 01JDSMP0000000000000000027
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000031
            port: in
        - id: 01JDSMP0000000000000000034
          from:
            node: 01JDSMP0000000000000000031
            port: 'false'
          to:
            node: 01JDSMP0000000000000000033
            port: in
        - id: 01JDSMP0000000000000000039
          from:
            node: 01JDSMP0000000000000000033
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000035
            port: in
        - id: 01JDSMP0000000000000000044
          from:
            node: 01JDSMP0000000000000000035
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000040
            port: in
        - id: 01JDSMP0000000000000000046
          from:
            node: 01JDSMP0000000000000000040
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000045
            port: in
        boundary:
          in: 01JDSMP0000000000000000013
          outputs:
            failed_hosts:
            - node: 01JDSMP0000000000000000031
              port: 'true'
              reason: 'Push the baseline: failed before the always steps'
            ok_hosts:
            - node: 01JDSMP0000000000000000045
              port: ok_hosts
      status: implemented
    - id: 01JDSMP0000000000000000047
      key: report
      type: subflow
      title: Report
      subflow:
        nodes:
        - id: 01JDSMP0000000000000000048
          key: gather-facts
          type: task
          title: Gather facts
          intent: Gather the facts of the hosts (the play gathered them)
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.gather_facts
        - id: 01JDSMP0000000000000000049
          key: write-the-summary
          type: task
          title: Write the summary
          status: implemented
          impl:
            kind: module
            ref: ansible.builtin.copy
            params:
              content: "baseline done on {{ ansible_facts['hostname'] | default('localhost') }}\n"
              dest: '{{ out_dir | default(''/tmp/edge-baseline'') }}/summary.txt'
              mode: '0644'
          origin:
            task: baseline.yml#Write the summary#1
            design: fa2be8ad
          inputs:
            out_dir:
              type: string
              from: flow.out_dir
        edges:
        - id: 01JDSMP0000000000000000050
          from:
            node: 01JDSMP0000000000000000048
            port: ok_hosts
          to:
            node: 01JDSMP0000000000000000049
            port: in
        boundary:
          in: 01JDSMP0000000000000000048
          outputs:
            ok_hosts:
            - node: 01JDSMP0000000000000000049
              port: ok_hosts
      status: implemented
      settings:
        inventory_target: local
    edges:
    - id: 01JDSMP0000000000000000051
      from:
        node: 01JDSMP0000000000000000012
        port: ok_hosts
      to:
        node: 01JDSMP0000000000000000047
        port: in
    boundary:
      in: 01JDSMP0000000000000000012
      outputs:
        ok_hosts:
        - node: 01JDSMP0000000000000000047
          port: ok_hosts
  status: implemented
- id: 01JDSMP0000000000000000053
  key: done
  type: end
  title: Done
  outcome: success
edges:
- id: 01JDSMP0000000000000000010
  from:
    node: 01JDSMP0000000000000000001
    port: ok_hosts
  to:
    node: 01JDSMP0000000000000000002
    port: in
