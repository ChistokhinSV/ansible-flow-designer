  - { id: 01JCR6E0000000000000000008, from: { node: 01JCR6N0000000000000000007, port: failed_hosts }, to: { node: 01JCR6N0000000000000000008, port: in } }
  - { id: 01JCR6E0000000000000000009, from: { node: 01JCR6N0000000000000000002, port: failed_hosts }, to: { node: 01JCR6N0000000000000000008, port: in } }
