  - { id: 01JCR6E0000000000000000005, from: { node: 01JCR6N0000000000000000005, port: ok_hosts }, to: { node: 01JCR6N0000000000000000006, port: in } }
  - { id: 01JCR6E0000000000000000006, from: { node: 01JCR6N0000000000000000005, port: failed_hosts }, to: { node: 01JCR6N0000000000000000007, port: in } }
