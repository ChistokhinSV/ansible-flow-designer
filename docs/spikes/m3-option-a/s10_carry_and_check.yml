# Q: approval segments: rebuild host groups from an artifact (extra var) with add_host;
# templated first hosts pattern with an unknown host; group_by/add_host in --check
- name: segment 2 starts by restoring host sets
  hosts: localhost
  gather_facts: false
  vars:
    afd_hostsets: {r_approved: [sw-edge-02, sw-edge-04]}
  tasks:
    - ansible.builtin.add_host:
        name: "{{ item.1 }}"
        groups: "{{ item.0.key }}"
      loop: "{{ afd_hostsets | dict2items | subelements('value') }}"
- name: next node on restored set
  hosts: r_approved
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_after_approval}
- name: start from flow input
  hosts: "{{ devices | join(',') }}"
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_started}
- import_playbook: report.yml
