# Q: when every host of one play fails (open port, no rescue), do later plays for OTHER hosts run?
- name: node a
  hosts: sw-edge-01,sw-edge-02,sw-edge-04
  gather_facts: false
  vars: {sim_failed: [sw-edge-04]}
  tasks:
    - block:
        - ansible.builtin.debug: {msg: work}
          failed_when: inventory_hostname in sim_failed
        - ansible.builtin.group_by: {key: r_a_ok}
      rescue:
        - ansible.builtin.group_by: {key: r_a_failed}
- name: node b (failed_hosts open, every host fails)
  hosts: r_a_ok
  gather_facts: false
  tasks:
    - ansible.builtin.debug: {msg: work}
      failed_when: true
- name: node c (handler for a.failed_hosts)
  hosts: r_a_failed
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_c_ran}
- import_playbook: report.yml
