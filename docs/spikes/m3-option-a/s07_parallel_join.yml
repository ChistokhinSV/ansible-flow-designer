# Q: parallel = host in every branch group; join all = intersection, any = union (dynamic groups)
- name: parallel
  hosts: sw-edge-01,sw-edge-02,sw-edge-04
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_branch_1}
    - ansible.builtin.group_by: {key: r_branch_2}
- name: branch 1
  hosts: r_branch_1
  gather_facts: false
  tasks:
    - block:
        - ansible.builtin.debug: {msg: b1}
          failed_when: inventory_hostname == 'sw-edge-01'
        - ansible.builtin.group_by: {key: r_b1_ok}
      rescue:
        - ansible.builtin.group_by: {key: r_b1_failed}
- name: branch 2
  hosts: r_branch_2
  gather_facts: false
  tasks:
    - block:
        - ansible.builtin.debug: {msg: b2}
          failed_when: inventory_hostname == 'sw-edge-04'
        - ansible.builtin.group_by: {key: r_b2_ok}
      rescue:
        - ansible.builtin.group_by: {key: r_b2_failed}
- name: join all
  hosts: "r_b1_ok:&r_b2_ok"
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_join_all}
- name: join any
  hosts: "r_b1_ok:r_b2_ok"
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_join_any}
- name: no host routed here
  hosts: r_never
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_never_ran}
- import_playbook: report.yml
