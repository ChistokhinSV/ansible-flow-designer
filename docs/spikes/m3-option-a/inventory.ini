# Fictional hosts for the M3 Option A spike. No device is contacted: reachable hosts use the
# local connection; sw-edge-03 points ssh at a closed port on the container, so it is unreachable.
[edge]
sw-edge-01
sw-edge-02
sw-edge-03 ansible_connection=ssh ansible_host=127.0.0.1 ansible_port=1
sw-edge-04

[edge:vars]
ansible_connection=local
ansible_python_interpreter={{ ansible_playbook_python }}
