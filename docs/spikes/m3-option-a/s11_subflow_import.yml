# Q: a subflow level as an imported playbook whose plays target parent groups (bubbling)
- name: parent node a
  hosts: sw-edge-01,sw-edge-02
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_a_ok}
- import_playbook: s11_inner.yml
- name: parent node after subflow
  hosts: r_sub_ok_hosts
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_after_sub}
- import_playbook: report.yml
