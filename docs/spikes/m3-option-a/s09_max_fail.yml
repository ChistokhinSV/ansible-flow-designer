# Q: does the play keyword max_fail_percentage see rescued hosts (play a)? Can a threshold task
# stop the whole flow on its own (play b)?
- name: node a, play keyword only
  hosts: sw-edge-01,sw-edge-02,sw-edge-04
  gather_facts: false
  max_fail_percentage: 30
  tasks:
    - block:
        - ansible.builtin.debug: {msg: work}
          failed_when: inventory_hostname in ['sw-edge-01', 'sw-edge-02']
        - ansible.builtin.group_by: {key: r_a_ok}
      rescue:
        - ansible.builtin.group_by: {key: r_a_failed}
- name: node b, threshold task
  hosts: sw-edge-01,sw-edge-02,sw-edge-04
  gather_facts: false
  tasks:
    - block:
        - ansible.builtin.debug: {msg: work}
          failed_when: inventory_hostname in ['sw-edge-01', 'sw-edge-02']
        - ansible.builtin.group_by: {key: r_b_ok}
      rescue:
        - ansible.builtin.group_by: {key: r_b_failed}
    - name: "[b] max_fail_percentage 30 exceeded"
      ansible.builtin.fail:
        msg: "{{ groups['r_b_failed'] | length }} of {{ ansible_play_hosts_all | length }} hosts failed"
      when: (groups['r_b_failed'] | default([]) | length) * 100 > 30 * (ansible_play_hosts_all | length)
- name: next node
  hosts: r_b_ok:r_b_failed
  gather_facts: false
  tasks:
    - ansible.builtin.group_by: {key: r_next_ran}
- import_playbook: report.yml
