# Example flow document. IDs are sample ULIDs. Values in [BRACKETS] are placeholders.
schema_version: 1
flow:
  id: 01JBH3BV4H15G5E4G7X0NTH82F
  key: os-upgrade-edge
  name: OS upgrade · edge switches
  version: 1
  goal: Upgrade edge switches to the target OS image in batches, with approval, traffic drain and per-host rollback.
  owner: netops
  runtime:
    kind: awx_workflow
    template: '[AWX TEMPLATE NAME]'
  inputs:
    site:
      type: string
      required: true
    devices:
      type: host_list
      required: true
    target_version:
      type: string
      required: true
    target_image:
      type: string
      required: true
nodes:
- id: 01JB7AG3BCKKDJWBHP1G201CYF
  key: start
  type: start
  title: Start
- id: 01JBW6VZSKDENC8SP3804GVA35
  key: pre-checks
  type: task
  title: Pre-checks
  status: implemented
  intent: Check version, health and free flash space
- id: 01JBRJFJ2XBAHW0GQNMF2KDPB0
  key: upgrade-needed
  type: decision
  title: Upgrade needed?
  condition: ansible_net_version is version(target_version, '<')
- id: 01JBNR5YHCF05G59S2S1KKE59R
  key: change-approval
  type: approval
  title: Change approval
  ports:
  - timeout
  settings:
    timeout: 4h
- id: 01JBMZ9J92V81E5128Q6RW31FZ
  key: backup-config
  type: task
  title: Backup config
  status: implemented
  ports:
  - undo
  outputs:
    backup_ref:
      type: string
- id: 01JBG0X454YG4GFDEXZR4YJ2C4
  key: drain-traffic
  type: subflow
  title: Drain traffic
  status: implemented
  ports:
  - undo
  settings:
    inventory_target: edge_switches,core_spines
- id: 01JB9NGK80Y3ZH6DZJJXXX7CK5
  key: upgrade-os
  type: subflow
  title: Upgrade OS
  status: implemented
  ports:
  - unreachable
  - undo
  impl:
    kind: role
    ref: netops.os_upgrade
    collection_version: 2.3.1
  undo:
    kind: role
    ref: netops.os_upgrade
    params:
      tasks_from: boot_previous
  subflow:
    nodes:
    - id: 01JBXHMFYFF1TK31CZT5GEVQEZ
      key: stage-image
      type: task
      title: Stage image
      status: implemented
      impl:
        kind: role
        ref: netops.os_upgrade
        params:
          tasks_from: stage
    - id: 01JB2NTQSC0J4DZCKCEXEGJ6ZB
      key: verify-checksum
      type: task
      title: Verify checksum
      status: implemented
      settings:
        retries: 2
      impl:
        kind: role
        ref: netops.os_upgrade
        params:
          tasks_from: checksum
    - id: 01JBEZT39S3D19T33BSWM75ANC
      key: set-boot-variable
      type: task
      title: Set boot variable
      status: implemented
      inputs:
        target_image:
          type: string
          from: flow.target_image
      outputs:
        boot_result:
          type: dict
          from: impl.register
      impl:
        kind: module
        ref: cisco.ios.ios_config
        collection_version: 9.0.3
        params:
          lines:
          - boot system flash:{{ target_image }}
          save_when: modified
        register: boot_result
    - id: 01JBBX2KRQNWA605H5PT7DRPKV
      key: reload
      type: task
      title: Reload
      status: implemented
      settings:
        serial: 25%
      impl:
        kind: role
        ref: netops.os_upgrade
        params:
          tasks_from: reload
    - id: 01JB53YCQWCMQY1TFS2R2X43GC
      key: wait-for-ssh
      type: task
      title: Wait for SSH
      status: implemented
      ports:
      - unreachable
      settings:
        timeout: 15m
      impl:
        kind: module
        ref: ansible.builtin.wait_for_connection
        params:
          timeout: 900
    - id: 01JB4NQHN2GMHK041E6YXRGVZ8
      key: verify-version
      type: task
      title: Verify version
      status: implemented
      impl:
        kind: role
        ref: netops.os_upgrade
        params:
          tasks_from: verify
    edges:
    - id: 01JBZB0K9FMMXQ5CSAFT42YMAV
      from:
        node: 01JBXHMFYFF1TK31CZT5GEVQEZ
        port: ok_hosts
      to:
        node: 01JB2NTQSC0J4DZCKCEXEGJ6ZB
        port: in
    - id: 01JB64G5D6TZWBE8TXF7JJHHQG
      from:
        node: 01JB2NTQSC0J4DZCKCEXEGJ6ZB
        port: ok_hosts
      to:
        node: 01JBEZT39S3D19T33BSWM75ANC
        port: in
    - id: 01JBGCWFBFF9JCM4SGFE6X260Y
      from:
        node: 01JBEZT39S3D19T33BSWM75ANC
        port: ok_hosts
      to:
        node: 01JBBX2KRQNWA605H5PT7DRPKV
        port: in
    - id: 01JBEWQ2JE73CC4QBWG06PD2QN
      from:
        node: 01JBBX2KRQNWA605H5PT7DRPKV
        port: ok_hosts
      to:
        node: 01JB53YCQWCMQY1TFS2R2X43GC
        port: in
    - id: 01JB92DG2D0MTQBK4D2ZY4T6S9
      from:
        node: 01JB53YCQWCMQY1TFS2R2X43GC
        port: ok_hosts
      to:
        node: 01JB4NQHN2GMHK041E6YXRGVZ8
        port: in
    boundary:
      in: 01JBXHMFYFF1TK31CZT5GEVQEZ
      outputs:
        ok_hosts:
        - node: 01JB4NQHN2GMHK041E6YXRGVZ8
          port: ok_hosts
        failed_hosts:
        - node: 01JB4NQHN2GMHK041E6YXRGVZ8
          port: failed_hosts
        unreachable:
        - node: 01JB53YCQWCMQY1TFS2R2X43GC
          port: unreachable
- id: 01JBY1JX4WHRDD459GQ8H7QEZZ
  key: post-checks
  type: task
  title: Post-checks
  status: implemented
- id: 01JBS1A0ZWSK9TPRM7N0MNS7C0
  key: restore-traffic
  type: subflow
  title: Restore traffic
  status: implemented
- id: 01JBJGQ4SR4QVH3H63J9FHVMCQ
  key: done
  type: end
  title: Done
  outcome: success
- id: 01JBV1SD53TW8JZ38AYTNJKGGS
  key: excluded
  type: end
  title: Excluded
  outcome: failed
- id: 01JBFKYS7AA4DZEWNWV8CF5BN5
  key: stopped
  type: end
  title: Stopped
  outcome: failed
- id: 01JBMFQGC1TRTDRHN3ZHQ8D5HF
  key: notify-on-call
  type: task
  title: Notify on-call
  status: draft
- id: 01JBRSWVK182VYZ04SXWF6E996
  key: rollback
  type: task
  title: Rollback
  status: draft
  intent: Run undo of completed nodes in reverse, failed hosts only
- id: 01JBX5208E2K8GV764KCRGE00K
  key: failed
  type: end
  title: Failed
  outcome: failed
