# Example flow document. IDs are sample ULIDs. Values in [BRACKETS] are placeholders.
schema_version: 1
flow:
  id: 01JBM9S346Q3D25VT4F5V37E3S
  key: edge-baseline
  name: Edge baseline
  version: 3
  goal: All edge switches at a site get the NTP, AAA and syslog baseline, with a backup taken first and automatic
    rollback if validation fails.
  owner: netops
  runtime:
    kind: awx_workflow
    template: 'AFD · edge-baseline'
  inputs:
    site:
      type: string
      required: true
    devices:
      type: host_list
      required: true
    dry_run:
      type: boolean
      default: false
nodes:
- id: 01JB3E28JT97KB6CQ643DZVMXX
  key: start
  type: start
  title: Start
- id: 01JBQKFBF5KZNWJ47TAN9ZT24M
  key: precheck
  type: task
  title: Pre-checks
  status: draft
  intent: Verify reachability and current OS version
  inputs:
    devices:
      type: host_list
      from: flow.devices
  outputs:
    precheck_report:
      type: dict
  impl: null
- id: 01JBNPZX45HY43KWJRP1XPA7Z3
  key: backup-config
  type: task
  title: Backup config
  status: specified
  intent: Save running config to Git
  inputs:
    devices:
      type: host_list
      from: flow.devices
  outputs:
    backup_ref:
      type: string
  impl: null
- id: 01JBDJ8FSSZ5AWSH8VHTPRE95B
  key: push-baseline
  type: subflow
  title: Push baseline
  status: implemented
  intent: Apply NTP, AAA and syslog baseline
  inputs:
    devices:
      type: host_list
    backup_ref:
      type: string
      from: backup-config.backup_ref
  outputs:
    change_report:
      type: dict
  impl:
    kind: role
    ref: netops.baseline.push_ntp_aaa
- id: 01JB9EE0ZBGJ09TQM83XSSSS6Y
  key: validate
  type: task
  title: Validate
  status: draft
  intent: Compare running config with desired state
  inputs:
    devices:
      type: host_list
    change_report:
      type: dict
      from: push-baseline.change_report
  impl: null
- id: 01JBS3C4DWA7N36096Q14DR9GP
  key: rollback
  type: task
  title: Rollback
  status: draft
  intent: Restore backup on failed hosts
  inputs:
    backup_ref:
      type: string
      from: backup-config.backup_ref
  impl: null
- id: 01JBQY77ZXYYK596NGYA1DQ91K
  key: done
  type: end
  title: Done
  outcome: success
- id: 01JB5GQAPENECFSECZP11HYGCP
  key: failed
  type: end
  title: Failed
  outcome: failed
